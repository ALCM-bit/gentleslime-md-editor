[package]
name = "gentleslime"
version = "0.1.0"
description = "GentleSlime: local-first Markdown reader and editor"
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "gentleslime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Direct dependencies are pinned exactly; update them on purpose, in their own PR.
# Keep tauri in step with @tauri-apps/api and @tauri-apps/cli in apps/native/package.json.
[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
